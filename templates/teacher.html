<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word Wall — Teacher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
  <div class="between" style="margin-bottom:16px">
    <div class="row"><span style="font-weight:800">◆ WORD WALL</span><span class="pill brand">Teacher</span></div>
    <a class="btn ghost" href="/">← Home</a>
  </div>

  <!-- SETUP -->
  <div id="setup" class="card stack">
    <h2 style="font-size:22px">Build your prompts</h2>
    <p class="muted small" style="margin:0">One prompt per line. Optionally add the expected answer after a <b>|</b> (only you see it).</p>
    <textarea id="questions" class="input" spellcheck="false">Give one word that means the same as HAPPY | joyful, glad, cheerful
Name a word that rhymes with LIGHT
One word to describe the water cycle
A synonym for BIG | huge, enormous, giant</textarea>
    <div class="row">
      <div><label class="field">Think time (locked)</label><div class="row" style="gap:6px"><input id="think" class="input num tnum" type="number" min="0" max="600" value="15"><span class="muted small">sec</span></div></div>
      <div><label class="field">Answer time</label><div class="row" style="gap:6px"><input id="answer" class="input num tnum" type="number" min="5" max="600" value="30"><span class="muted small">sec</span></div></div>
      <label class="row" style="gap:8px;cursor:pointer;align-self:flex-end;padding-bottom:6px"><input id="showwall" type="checkbox" checked><span class="small">Show wall to students on reveal</span></label>
    </div>
    <button id="create" class="btn primary big full">Start session →</button>
    <div id="setup-err" class="pill danger hidden"></div>
  </div>

  <!-- LIVE -->
  <div id="live" class="stack hidden">
    <div class="card between">
      <div><div class="muted small">Students join at <b id="origin"></b> → room</div><div class="codebox" id="code">----</div></div>
      <div class="stack" style="min-width:220px">
        <div class="row"><span class="pill brand" id="joined">0 joined</span><span class="pill live" id="answered">0 answered</span><span class="pill" id="phase">Ready</span></div>
        <div class="row small"><span id="link" class="muted"></span></div>
      </div>
    </div>

    <div class="grid">
      <div class="card stack">
        <div class="between"><span class="muted small" id="qmeta">Prompt 1</span><span class="pill tnum hidden" id="timer">0s</span></div>
        <h2 id="prompt" style="font-size:clamp(22px,4vw,34px)">—</h2>
        <div id="expected" class="pill hidden"></div>
        <hr class="hr">
        <div id="wallwrap"><div class="muted small">Answers appear here as students submit.</div><div class="wall" id="wall"></div></div>
      </div>

      <div class="stack">
        <div class="card stack">
          <h3 style="font-size:16px">Controls</h3>
          <button id="c-start" class="btn primary full">Start round ▶</button>
          <button id="c-skip" class="btn full hidden">Skip thinking → open answers</button>
          <button id="c-reveal" class="btn ok full hidden">Reveal wall now</button>
          <div class="row"><button id="c-prev" class="btn grow">← Prev</button><button id="c-next" class="btn grow">Next →</button></div>
          <button id="c-end" class="btn ghost danger full">End session</button>
        </div>
        <div class="card stack">
          <div class="between"><h3 style="font-size:16px">Who answered</h3><span class="muted small" id="ratio">0/0</span></div>
          <div class="roster" id="roster"><div class="muted small">No students yet.</div></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="/static/teacher.js"></script>
</body>
</html>
